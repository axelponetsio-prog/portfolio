<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axel Ponet | Portfolio Admin Sys</title>
    <meta name="description" content="Portfolio d'Axel Ponet, étudiant BTS SIO (SISR). Administration systèmes, réseaux et cybersécurité.">
    <meta property="og:title" content="Axel Ponet | Admin Sys">
    <meta property="og:description" content="Portfolio interactif d'un futur administrateur systèmes et réseaux.">
    <meta property="og:image" content="https://axelponetsio-prog.github.io/portfolio/images/preview.png">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="main-nav">
        <div class="container">
            <div class="logo">AP<span>.admin</span></div>
            <ul class="nav-links">
                <li><a href="index.html" onclick="fadeOutIn(event)">Accueil</a></li>
                <li><a href="parcours.html" onclick="fadeOutIn(event)">Parcours</a></li>
                <li><a href="competences.html" onclick="fadeOutIn(event)">Compétences</a></li>
                <li><a href="projets.html" onclick="fadeOutIn(event)">Projets</a></li>
                <li><a href="veille.html" onclick="fadeOutIn(event)">Veille</a></li>
            </ul>
        </div>
    </nav>

    <div class="terminal-window" id="mainTerminal">
        <div class="terminal-header">
            <div class="window-buttons">
                <button class="win-btn minimize" title="Minimiser">─</button>
                <button class="win-btn maximize" title="Maximiser">□</button>
                <button class="win-btn close" title="Fermer">✕</button>
            </div>
            <div class="terminal-title">bash — axel@debian: ~</div>
        </div>
        <div class="terminal-body" id="terminalBody">
            <!-- Sortie dynamique -->
        </div>
        <div class="terminal-input-line">
            <span class="prompt">axel@debian:~$</span>
            <input type="text" id="terminalInput" autofocus placeholder="tapez help pour commencer...">
        </div>
    </div>

    <!-- Bouton pour rouvrir le terminal après fermeture -->
    <button id="reopen-terminal" title="Ouvrir le terminal">⌨️</button>

    <!-- Modale de contact (inchangée) -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="color: #38bdf8; margin-bottom:20px;">📩 Me contacter</h2>
            <form action="https://formspree.io/f/xeenznzv" method="POST" enctype="multipart/form-data">
                <input type="email" name="email" placeholder="Votre Email" required>
                <textarea name="message" placeholder="Votre projet ou question..." rows="5" required></textarea>
                <label style="display:block; margin-bottom:10px; font-size:0.8rem;">📎 Pièce jointe (CV, cahier des charges...) :</label>
                <input type="file" name="attachment" style="border:none; padding:0;">
                <button type="submit" class="btn" style="width:100%; margin-top:15px;">Envoyer</button>
            </form>
        </div>
    </div>

    <footer id="contact" style="text-align:center; padding: 40px; border-top: 1px solid rgba(56, 189, 248, 0.1); margin-top: 80px;">
        <p style="margin:0; font-size: 0.95rem;">© 2026 Axel Ponet</p>
        <div style="margin-top:20px; display:flex; justify-content:center; gap:30px; flex-wrap: wrap;">
            <a href="mailto:a.ponet@orange.fr" style="color:#38bdf8; text-decoration:none; font-weight:bold;">📧 a.ponet@orange.fr</a>
            <a href="https://www.linkedin.com/in/axel-ponet/" target="_blank" style="color:#38bdf8; text-decoration:none; font-weight:bold;">💼 LinkedIn</a>
            <a href="https://github.com/axelponetsio-prog" target="_blank" style="color:#38bdf8; text-decoration:none; font-weight:bold;">🐙 GitHub</a>
        </div>
    </footer>

    <script>
        // ====== TERMINAL INTERACTIF ======
        const terminalBody = document.getElementById('terminalBody');
        const input = document.getElementById('terminalInput');
        let commandHistory = [];
        let historyIndex = -1;

        // Commande initiale (affichée au chargement)
        const initialCommands = [
            { type: 'command', text: 'whoami' },
            { type: 'output', text: 'Axel Ponet - Étudiant BTS SIO (SISR)' },
            { type: 'command', text: 'ls skills/' },
            { type: 'output', text: 'Cybersécurité  Infrastructure  Réseaux  Virtualisation' },
            { type: 'command', text: './contact_me.sh' },
            { type: 'output', text: 'Tapez help pour voir les commandes disponibles.' }
        ];

        function appendLine(text, type = 'output') {
            const div = document.createElement('div');
            div.className = type === 'command' ? 'terminal-command' : 'terminal-output';
            if (type === 'command') {
                div.innerHTML = `<span class="prompt">axel@debian:~$</span> ${text}`;
            } else {
                div.textContent = text;
            }
            terminalBody.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function displayInitial() {
            initialCommands.forEach(cmd => appendLine(cmd.text, cmd.type));
        }

        // Machine à écrire simple pour l'accueil (on pourrait l'utiliser pour l'initial, mais on garde l'affichage direct pour la réactivité)
        // On conserve l'affichage direct des commandes initiales.

        displayInitial();

        // Gestion du prompt interactif
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                if (cmd === '') return;

                appendLine(cmd, 'command');
                commandHistory.push(cmd);
                historyIndex = commandHistory.length;
                input.value = '';

                processCommand(cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            }
        });

        function processCommand(cmd) {
            switch(cmd) {
                case 'help':
                    appendLine('Commandes disponibles :');
                    appendLine('  whoami     - Affiche mon identité');
                    appendLine('  skills     - Liste mes domaines de compétences');
                    appendLine('  about      - À propos de moi');
                    appendLine('  cv         - Télécharger mon CV');
                    appendLine('  contact    - Formulaire de contact');
                    appendLine('  neofetch   - Affiche les infos système');
                    appendLine('  clear      - Efface le terminal');
                    appendLine('  help       - Cette aide');
                    break;
                case 'whoami':
                    appendLine('Axel Ponet - Étudiant BTS SIO (SISR)');
                    break;
                case 'skills':
                    appendLine('Cybersécurité  Infrastructure  Réseaux  Virtualisation');
                    break;
                case 'about':
                    appendLine('Passionné par l\'administration systèmes et réseaux, je suis en BTS SIO option SISR.');
                    appendLine('Mon objectif : concevoir et maintenir des infrastructures fiables et sécurisées.');
                    appendLine('Reconversion depuis le tourisme, j\'apporte un regard neuf et une forte motivation.');
                    break;
                case 'cv':
                    appendLine('Téléchargement du CV...');
                    window.open('CV_PONET_Axel.pdf', '_blank'); // Assure-toi d'avoir un cv.pdf à la racine
                    break;
                case 'contact':
                    // Force la page à défiler tout en haut pour voir le terminal
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    // Ouvre la modale après un court délai pour laisser le défilement se faire
                    setTimeout(() => {
                        openModal();
                    }, 300);
                    break;
                case 'neofetch':
                    appendLine(`
  ⠀⠀⠀⢀⣤⣶⣿⣿⣿⣿⣶⣤⡀
  ⠀⢠⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⡄   Axel@Debian
  ⢠⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡄  OS: Debian 12
  ⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿  Shell: bash
  ⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿  Étudiant: BTS SIO SISR
  ⠈⠻⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠟⠁   Uptime: 2 ans
  ⠀⠀⠀⠈⠉⠛⠛⠛⠛⠉⠁
                    `.trim());
                    break;
                case 'clear':
                    terminalBody.innerHTML = '';
                    break;
                default:
                    appendLine(`Commande inconnue : ${cmd}. Tapez help pour la liste.`);
            }
        }

        // ====== BOUTONS DE LA FENÊTRE ======
        (function() {
            const terminal = document.getElementById('mainTerminal');
            const reopenBtn = document.getElementById('reopen-terminal');

            document.querySelector('.terminal-header .window-buttons').addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;

                if (btn.classList.contains('minimize')) {
                    terminal.classList.toggle('minimized');
                    terminal.classList.remove('maximized');
                    terminal.classList.remove('closed');
                } else if (btn.classList.contains('maximize')) {
                    terminal.classList.toggle('maximized');
                    terminal.classList.remove('minimized');
                    terminal.classList.remove('closed');
                } else if (btn.classList.contains('close')) {
                    terminal.classList.add('closed');
                    terminal.classList.remove('minimized', 'maximized');
                    reopenBtn.style.display = 'flex';
                }
            });

            reopenBtn.addEventListener('click', function() {
                terminal.classList.remove('closed', 'minimized', 'maximized');
                reopenBtn.style.display = 'none';
                input.focus();
            });

            document.querySelector('.terminal-header').addEventListener('click', function(e) {
                if (terminal.classList.contains('minimized') && !e.target.closest('button')) {
                    terminal.classList.remove('minimized');
                }
            });
        })();

        // ====== MODALE DE CONTACT ======
        function openModal() { document.getElementById('contactModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target == document.getElementById('contactModal')) closeModal();
        };

        // ====== TRANSITIONS DE PAGE ======
        function fadeOutIn(event) {
            event.preventDefault();
            const url = event.target.href;
            document.body.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }
        window.addEventListener('load', () => {
            document.body.classList.add('page-enter');
            document.getElementById('terminalInput').focus();
        });
    </script>
</body>
</html>
