<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axel Ponet | Portfolio Admin Sys</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav style="padding: 20px; text-align: center; border-bottom: 1px solid rgba(56, 189, 248, 0.1);">
        <a href="index.html" style="color: #38bdf8; text-decoration: none; margin: 0 15px; font-weight: bold;">Accueil</a>
        <a href="parcours.html" style="color: white; text-decoration: none; margin: 0 15px;">Parcours</a>
        <a href="competences.html" style="color: white; text-decoration: none; margin: 0 15px;">Compétences</a>
    </nav>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="dots">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <div class="terminal-title">bash — axel@debian: ~</div>
        </div>
        <div class="terminal-body">
            <p><span class="prompt">axel@debian:~$</span> whoami</p>
            <p class="response">Axel Ponet - Étudiant SISR</p>
            <p><span class="prompt">axel@debian:~$</span> ls skills/</p>
            <p class="response">Cybersécurité  Infrastructure  Réseaux  Virtualisation</p>
            <p><span class="prompt">axel@debian:~$</span> ./contact_me.sh_</p>
            
            <div class="terminal-actions" style="margin-top: 40px;">
                <button onclick="openModal()" class="btn">Me contacter</button>
                <a href="competences.html" class="btn btn-outline" style="margin-left:10px;">Voir compétences</a>
            </div>
        </div>
    </div>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="color: #38bdf8; margin-bottom:20px;">📩 Messagerie Directe</h2>
            <form action="https://formspree.io/f/ton_id" method="POST" enctype="multipart/form-data">
                <input type="email" name="email" placeholder="Votre Email" required>
                <textarea name="message" placeholder="Votre message..." rows="5" required></textarea>
                <label style="display:block; margin-bottom:10px; font-size:0.8rem;">📎 Pièce jointe :</label>
                <input type="file" name="attachment" style="border:none; padding:0;">
                <button type="submit" class="btn" style="width:100%; margin-top:10px;">Envoyer</button>
            </form>
        </div>
    </div>

    <footer id="contact" style="text-align:center; padding: 40px; border-top: 1px solid rgba(56, 189, 248, 0.1);">
        <p>&copy; 2024 Axel Ponet</p>
        <div style="margin-top:15px;">
            <a href="mailto:a.ponet@orange.fr" style="color:#38bdf8; text-decoration:none;">Email</a> | 
            <a href="#" style="color:#38bdf8; text-decoration:none;">LinkedIn</a>
        </div>
    </footer>

    <script>
        function openModal() { document.getElementById('contactModal').style.display = 'block'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target == document.getElementById('contactModal')) closeModal();
        }
    </script>
</body>
</html>
