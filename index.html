<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Axel Ponet | Admin Sys</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav style="padding: 20px; text-align: center; border-bottom: 1px solid #334155;">
        <a href="index.html" style="color: var(--primary); text-decoration: none; margin: 0 15px;">Accueil</a>
        <a href="parcours.html" style="color: white; text-decoration: none; margin: 0 15px;">Parcours</a>
        <a href="competences.html" style="color: white; text-decoration: none; margin: 0 15px;">Compétences</a>
    </nav>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        </div>
        <div class="terminal-body">
            <p><span class="prompt">axel@debian:~$</span> whoami</p>
            <p class="response">Axel Ponet - Étudiant SISR</p>
            <p><span class="prompt">axel@debian:~$</span> ls skills/</p>
            <p class="response">Cybersécurité  Infrastructure  Réseaux  Virtualisation</p>
            <p><span class="prompt">axel@debian:~$</span> ./contact_me.sh_</p>
            
            <div style="margin-top: 30px;">
                <button onclick="openModal()" class="btn">Me contacter</button>
                <a href="competences.html" class="btn" style="background:transparent; border: 1px solid var(--primary); color: var(--primary); margin-left: 10px;">Voir compétences</a>
            </div>
        </div>
    </div>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">📩 Nouveau Message</h2>
            <form action="https://formspree.io/f/ton_id" method="POST" enctype="multipart/form-data">
                <input type="email" name="email" placeholder="Votre Email" style="width:100%; margin-bottom:15px; padding:10px; background:#0f172a; border:1px solid #334155; color:white;">
                <textarea name="message" placeholder="Votre message..." style="width:100%; height:100px; margin-bottom:15px; padding:10px; background:#0f172a; border:1px solid #334155; color:white;"></textarea>
                <input type="file" name="upload" style="margin-bottom:15px; color:white;">
                <button type="submit" class="btn" style="width:100%">Envoyer</button>
                <p onclick="closeModal()" style="text-align:center; cursor:pointer; margin-top:15px; font-size:0.8rem;">Annuler</p>
            </form>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('contactModal').style.display = 'block'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
    </script>
</body>
</html>
