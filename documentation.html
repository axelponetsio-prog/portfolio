<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | Axel Ponet</title>
    <meta name="description" content="Documentation technique, rapports de stage, procédures par Axel Ponet.">
    <meta property="og:title" content="Documentation - Axel Ponet">
    <meta property="og:description" content="Ressources et documents techniques.">
    <meta property="og:image" content="https://axelponetsio-prog.github.io/portfolio/images/preview.png">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="container">
            <div class="logo">AP<span>.admin</span></div>
            <ul class="nav-links">
                <li><a href="index.html" onclick="fadeOutIn(event)">Accueil</a></li>
                <li><a href="parcours.html" onclick="fadeOutIn(event)">Parcours</a></li>
                <li><a href="competences.html" onclick="fadeOutIn(event)">Compétences</a></li>
                <li><a href="projets.html" onclick="fadeOutIn(event)">Projets</a></li>
                <li><a href="veille.html" onclick="fadeOutIn(event)">Veille</a></li>
                <li><a href="documentation.html" onclick="fadeOutIn(event)">Documentation</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-section">
        <div class="container">
            <h1 class="page-title">📁 Documentation</h1>

            <div class="search-container">
                <input type="text" id="searchDocs" placeholder="Rechercher un document...">
            </div>

            <!-- Filtres par catégorie -->
            <div class="filter-buttons" id="docFilters">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <!-- Les boutons de catégories seront ajoutés dynamiquement -->
            </div>

            <!-- Conteneur des cartes de documents -->
            <div class="documents-grid" id="documentsGrid"></div>
        </div>
    </section>

    <script>
        // 📚 Base de données des documents (modifie et ajoute ici)
        const documents = [
            // ===== 1ère année =====
            { title: "KeePass – Gestionnaire de mots de passe", description: "...", file: "docs/Keepass.pdf", category: "1ère année", icon: "🔐" },
            { title: "PSSI pour le laboratoire", description: "...", file: "docs/PSSI pour le labo.pdf", category: "1ère année", icon: "🛡️" },
            { title: "Scripts de mise à jour et sauvegarde", description: "...", file: "docs/script_sauv.pdf", category: "1ère année", icon: "💾" },
            { title: "Update automatique des postes fixes", description: "...", file: "docs/upd_pf.pdf", category: "1ère année", icon: "🔄" },
            { title: "ETHIC – Plateforme de participation citoyenne", description: "...", file: "docs/ETHIC.pdf", category: "1ère année", icon: "🌱" },
            { title: "Tri des magazines", description: "...", file: "docs/TRI DES MAGAZINES.pdf", category: "1ère année", icon: "📚" },
        
            // ===== 2ème année =====
            { title: "Documentation Proxmox", description: "...", file: "docs/Docu_ Proxmox.pdf", category: "2ème année", icon: "🖥️" },
            { title: "Installation de Nextcloud", description: "...", file: "docs/Installation-Nextcloud.pdf", category: "2ème année", icon: "☁️" },
            { title: "Configuration HTTPS pour Nextcloud", description: "...", file: "docs/https_nextcloud.pdf", category: "2ème année", icon: "🔒" },
            { title: "Résolution de problèmes Proxmox", description: "...", file: "docs/Resolution_prblm_Proxmox.pdf", category: "2ème année", icon: "🔧" },
            { title: "Récupération de mot de passe Wiki.js", description: "...", file: "docs/recup_mdp_wiki.pdf", category: "2ème année", icon: "🔑" },
            { title: "Organisation du laboratoire (v2)", description: "...", file: "docs/orga_labo.pdf", category: "2ème année", icon: "🏢" },
            { title: "Script de sauvegarde de site web", description: "...", file: "docs/script_site_web.pdf", category: "2ème année", icon: "📜" },
            { title: "Boot d'un PC Windows sur Lubuntu", description: "...", file: "docs/Boot_Lubuntu.pdf", category: "2ème année", icon: "💻" },
            { title: "Configuration de Windows Server", description: "...", file: "docs/Config_Windows_Serv.pdf", category: "2ème année", icon: "🪟" }
        ];

        let activeCategory = 'all';

        function renderDocuments(category = 'all', searchTerm = '') {
            const grid = document.getElementById('documentsGrid');
            let filtered = documents;

            if (category !== 'all') {
                filtered = filtered.filter(doc => doc.category === category);
            }

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(doc => 
                    doc.title.toLowerCase().includes(term) ||
                    doc.description.toLowerCase().includes(term)
                );
            }

            grid.innerHTML = '';
            filtered.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'p-card doc-card';
                card.innerHTML = `
                    <div class="p-tag">${doc.icon} ${doc.category}</div>
                    <h3>${doc.title}</h3>
                    <p>${doc.description}</p>
                    <a href="${doc.file}" target="_blank" class="btn btn-outline" style="margin-top:10px; display: inline-block;">
                        📎 Consulter
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function setupCategories() {
            const categories = [...new Set(documents.map(doc => doc.category))];
            const filterContainer = document.getElementById('docFilters');
            // On garde le bouton "Tous" déjà présent
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = cat;
                btn.textContent = cat;
                filterContainer.appendChild(btn);
            });

            // Gestion des clics sur les filtres
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('#docFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    activeCategory = e.target.dataset.filter;
                    const searchInput = document.getElementById('searchDocs');
                    renderDocuments(activeCategory, searchInput.value);
                }
            });
        }

        // Barre de recherche
        document.getElementById('searchDocs').addEventListener('input', (e) => {
            renderDocuments(activeCategory, e.target.value);
        });

        // Initialisation
        setupCategories();
        renderDocuments();

        // Transitions
        function fadeOutIn(event) {
            event.preventDefault();
            const url = event.target.href;
            document.body.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }
        window.addEventListener('load', () => {
            document.body.classList.add('page-enter');
        });
    </script>
</body>
</html>
